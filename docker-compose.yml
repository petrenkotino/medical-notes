services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: medical_notes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/medical_notes
      PORT: 3000
      DB_POOL_MAX: 10
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
